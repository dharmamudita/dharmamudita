<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- SPIDERWEB PATTERN -->
    <pattern id="matrix-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" rx="3" fill="#1C2128" />
    </pattern>
    <style>
      @keyframes crawl {
        0%   { transform: translate(40px, 30px); }
        25%  { transform: translate(320px, 90px); }
        50%  { transform: translate(650px, 40px); }
        75%  { transform: translate(450px, 120px); }
        100% { transform: translate(40px, 30px); }
      }
      @keyframes leg-left {
        0%, 100% { transform: rotate(-5deg); }
        50%      { transform: rotate(15deg); }
      }
      @keyframes leg-right {
        0%, 100% { transform: rotate(5deg); }
        50%      { transform: rotate(-15deg); }
      }
      @keyframes web-glow {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 0.8; }
      }
      .spider-agent {
        animation: crawl 14s infinite ease-in-out;
      }
      .left-legs {
        transform-origin: center;
        animation: leg-left 0.4s infinite alternate ease-in-out;
      }
      .right-legs {
        transform-origin: center;
        animation: leg-right 0.4s infinite alternate ease-in-out;
      }
      .web-line {
        animation: web-glow 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="880" height="180" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2" />

  <!-- MATRIX COMMIT GRID -->
  <rect x="20" y="20" width="840" height="140" fill="url(#matrix-grid)" />

  <!-- DYNAMIC HIGHLIGHTED COMMIT BLOCKS -->
  <!-- Level 1 (Dark Grey) -->
  <rect x="68" y="36" width="12" height="12" rx="3" fill="#39D353" opacity="0.3" />
  <rect x="116" y="68" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.4" />
  <rect x="212" y="52" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="340" y="84" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.6" />
  <rect x="420" y="36" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.4" />
  <rect x="548" y="100" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="692" y="52" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.7" />
  <rect x="756" y="84" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.8" />
  <rect x="804" y="36" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.9" />

  <!-- Active Nodes -->
  <rect x="180" y="84" width="12" height="12" rx="3" fill="#FFFFFF" />
  <rect x="308" y="52" width="12" height="12" rx="3" fill="#FFFFFF" />
  <rect x="468" y="116" width="12" height="12" rx="3" fill="#FFFFFF" />
  <rect x="628" y="68" width="12" height="12" rx="3" fill="#FFFFFF" />
  <rect x="740" y="116" width="12" height="12" rx="3" fill="#FFFFFF" />

  <!-- CONNECTING SPIDERWEB TRAILS -->
  <path class="web-line" d="M 60 40 L 340 100 L 670 50 L 470 130 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,4" />
  <path class="web-line" d="M 200 90 L 450 50 L 760 90" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,4" opacity="0.5" />

  <!-- ANIMATED SPIDER (LABA-LABA) -->
  <g class="spider-agent">
    <!-- SPIDER BODY -->
    <ellipse cx="25" cy="25" rx="10" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <circle cx="25" cy="14" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    
    <!-- SPIDER EYES (RED GLOW) -->
    <circle cx="23" cy="13" r="1.5" fill="#FF3366" />
    <circle cx="27" cy="13" r="1.5" fill="#FF3366" />

    <!-- SPIDER BACK EMBLEM -->
    <polygon points="25,20 28,26 25,32 22,26" fill="#000000" />

    <!-- 4 LEFT LEGS -->
    <g class="left-legs">
      <!-- Leg 1 -->
      <path d="M 18 16 Q 8 6 4 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 2 -->
      <path d="M 16 22 Q 4 16 0 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 3 -->
      <path d="M 16 28 Q 6 34 2 40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 4 -->
      <path d="M 18 34 Q 10 44 8 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 4 RIGHT LEGS -->
    <g class="right-legs">
      <!-- Leg 1 -->
      <path d="M 32 16 Q 42 6 46 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 2 -->
      <path d="M 34 22 Q 46 16 50 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 3 -->
      <path d="M 34 28 Q 44 34 48 40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Leg 4 -->
      <path d="M 32 34 Q 40 44 42 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- SILK THREAD FROM SPIDER -->
    <line x1="25" y1="37" x2="25" y2="70" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,2" opacity="0.7" />
  </g>

  <!-- BOTTOM STATUS -->
  <text x="35" y="165" fill="#8B949E" font-family="monospace, sans-serif" font-size="11" font-weight="bold">
    ⚡ ARACHNID MATRIX: ACTIVE CRAWLER &bull; WEAVING 1,159+ CONTRIBUTIONS
  </text>
</svg>
